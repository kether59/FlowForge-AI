services:
  backend:
    build: ./backend
    container_name: flowforge-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Surcharge possible via variables d'environnement de l'hôte
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-mock}
    ports:
      - "8000:8000"
    volumes:
      - flowforge-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: flowforge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  # Optionnel : modèle local. Décommentez pour utiliser le provider "ollama".
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: flowforge-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-models:/root/.ollama

volumes:
  flowforge-data:
  # ollama-models:
